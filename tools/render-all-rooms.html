<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luma references — all Dec 2025 rooms</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1614; color: #D4C5B2; font-family: Georgia, serif; padding: 24px; }
    h1 { font-weight: 400; font-size: 1.2rem; margin-bottom: 8px; }
    p.lede { color: #b8a99a; font-size: 0.9rem; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .card { background: #000; position: relative; }
    .card canvas { width: 100%; height: auto; display: block; }
    .card .label {
      position: absolute; bottom: 8px; left: 8px;
      background: rgba(10,9,8,0.75); padding: 4px 10px;
      font-size: 0.8rem; color: #D4B89C; font-family: ui-monospace, monospace;
    }
    .card .label.done { color: #8ad4a0; }
    .card .label.fail { color: #d48a8a; }
    #status { margin-top: 16px; font-size: 0.85rem; color: #8a7e74; }
    #status.done { color: #D4B89C; }
  </style>
</head>
<body>
  <h1>Bakervale · Dec 2025 · All rooms · 1920×1080 Luma references</h1>
  <p class="lede">
    Yaw 0° / FOV 85° / Pitch 0°. Each room's flat view accessible via
    <code>window.frames['Kitchen']</code> etc. Download via
    <code>window.frameBase64('Kitchen')</code>.
  </p>
  <div class="grid" id="grid"></div>
  <div id="status">Queued…</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
  <script>
    const R2 = 'https://pub-1008667921dc46088c845c1f999cb016.r2.dev';
    const PROJECT = '1-1067Bakervale%20Drive/images';
    const DATE = '20251206';

    const ROOMS = [
      'Bathroom',
      'Bedroom',
      'Corridor',
      'Entrance',
      'Hallway',
      'Kitchen',
      'Laundry%20Room',
      'Living%20Room',
      'Mechanical%20Room',
      'Office%201',
      'Office%202',
      'Side%20Entrance',
      'Staircase',
    ];

    const YAW   = 0;
    const PITCH = 0;
    const FOV   = 85;
    const W     = 1920;
    const H     = 1080;
    const JPEG_QUALITY = 0.9;

    window.frames = {};
    window.frameBase64 = (room) => window.frames[room]?.toDataURL('image/jpeg', JPEG_QUALITY).split(',')[1];
    window.allReady = false;

    const grid = document.getElementById('grid');
    const status = document.getElementById('status');

    function loadTexture(url) {
      return new Promise((resolve, reject) => {
        const loader = new THREE.TextureLoader();
        loader.crossOrigin = 'anonymous';
        loader.load(url, resolve, undefined, reject);
      });
    }

    async function renderOne(roomEnc) {
      const roomDisplay = decodeURIComponent(roomEnc);
      const card = document.createElement('div');
      card.className = 'card';
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      card.appendChild(canvas);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = `${roomDisplay}  ·  loading…`;
      card.appendChild(label);
      grid.appendChild(card);

      try {
        const tex = await loadTexture(`${R2}/${PROJECT}/${DATE}/${roomEnc}.jpg`);
        if ('colorSpace' in tex && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
        else if ('encoding' in tex && THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(W, H, false);
        if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
        else if ('outputEncoding' in renderer && THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;

        const scene = new THREE.Scene();
        const geo = new THREE.SphereGeometry(500, 120, 80);
        geo.scale(-1, 1, 1);
        scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex })));

        const cam = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 1000);
        cam.rotation.order = 'YXZ';
        cam.rotation.y = -YAW * Math.PI / 180;
        cam.rotation.x = PITCH * Math.PI / 180;

        renderer.render(scene, cam);
        window.frames[roomDisplay] = canvas;
        label.textContent = `${roomDisplay}  ·  done`;
        label.classList.add('done');
      } catch (err) {
        label.textContent = `${roomDisplay}  ·  FAILED`;
        label.classList.add('fail');
        console.error('[', roomDisplay, ']', err);
      }
    }

    (async () => {
      status.textContent = `Rendering ${ROOMS.length} rooms sequentially…`;
      for (const r of ROOMS) await renderOne(r);
      window.allReady = true;
      status.textContent = `All ${ROOMS.length} rooms rendered. Ready for extraction.`;
      status.classList.add('done');
    })();
  </script>
</body>
</html>
